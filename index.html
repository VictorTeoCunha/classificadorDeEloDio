<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Elo - LoL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 

    <div class="container">
        <h1>Calculadora de Elo</h1>

        <div class="input-group">
            <label for="vitoria">Vitórias:</label>
            <input type="number" id="vitoria" name="valorVitoria" placeholder="Ex: 50">
        </div>

        <div class="input-group">
            <label for="derrota">Derrotas:</label>
            <input type="number" id="derrota" name="valorderrota" placeholder="Ex: 20"> 
        </div>

        <div class="btn-group">
            <button onclick="main()">Calcular</button>
            <button onclick="gerarRelatorio()">Relatório</button>
        </div>

        <p id="resposta"></p>
        <p id="relatorio"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
